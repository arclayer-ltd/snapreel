name: iOS build

# One job per run: compile everything (both targets, every error reported), screenshot every
# debug screen at 375x812 points, and optionally archive, sign and upload to TestFlight.
# Runs only when started by hand:
#   gh workflow run ios.yml [-f testflight=true] [-f screenshots=false] [-f only=<id prefix>]
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Archive, sign and upload to TestFlight
        type: boolean
        default: false
      screenshots:
        description: Screenshot every debug screen
        type: boolean
        default: true
      only:
        description: Only screenshot ids starting with these space-separated prefixes (empty = all)
        type: string
        default: ""
      dark:
        # A second pass with the simulator in Dark mode, over these id prefixes ("none" skips it).
        description: Dark-mode screenshot prefixes (none = skip)
        type: string
        default: "start.welcome start.intro start.use.selected start.tour.1 start.tour.intro home.filled home.empty lib.videos lib.folders lib.actions notif.feed search.results settings.root settings.appearance settings.recording settings.storage.confirm help.home help.article legal.menu rec.shell rec.camera.recording rec.review video.player video.details photos.audio video.photos.alert share.sheet kit.components"
      flows:
        # Screen recordings of the debug flows (Debug/DebugFlows.swift) for snapreel.video, Light and
        # Dark, into ci-out/flows and ci-out/dark/flows. Usually run with screenshots=false.
        description: Record these flow id prefixes as videos (empty = none), e.g. "flow."
        type: string
        default: ""
      runner:
        # xcode-27 (Apple silicon, macOS 27) builds with the iOS 27 SDK, which App Store Connect
        # requires for uploads from April 2027 (ITMS-90725). The others build with the iOS 26 SDK.
        description: macOS runner image
        type: choice
        options: [xcode-27, macos-26, macos-15, macos-15-intel, macos-latest]
        default: xcode-27
      tests:
        # SnapreelTests (unit tests and the editor's measurements on 1, 9 and 30 minute recordings).
        description: Run the unit tests and measurements (separate job)
        type: boolean
        default: false
      test_only:
        description: Only these space-separated test classes or Class/test names (empty = all)
        type: string
        default: ""
      test_ios:
        description: iOS version to test on, e.g. 16.4 (downloaded if needed; empty = newest installed)
        type: string
        default: ""
      device:
        # Another simulator for the screenshots, e.g. "iPhone SE (3rd generation)" (empty = 375x812).
        description: Simulator for the screenshots
        type: string
        default: ""
      text_size:
        # Dynamic Type for the screenshots, e.g. accessibility-extra-extra-extra-large (empty = large).
        description: Text size for the screenshots
        type: string
        default: ""
      benchmarks:
        description: With tests, also measure preparing share links and iOS's background session
        type: boolean
        default: false
      build:
        description: Run the build, screenshots and TestFlight job
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.tests && !inputs.build && format('tests-{0}', inputs.test_ios) || 'build' }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.build }}
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    # A full Light pass (~60 min) plus a Dark pass over every recorder and player screen (~30 min).
    timeout-minutes: 140
    env:
      TEAM_ID: N3DBKUVJS5
      BUNDLE_ID: co.arclayer.snapreel
      BROADCAST_BUNDLE_ID: co.arclayer.snapreel.broadcast
      LIVE_ACTIVITY_BUNDLE_ID: co.arclayer.snapreel.liveactivity
      APP_PROFILE: Snapreel App Store Push
      BROADCAST_PROFILE: Snapreel Broadcast App Store
      LIVE_ACTIVITY_PROFILE: Snapreel Live Activity App Store
      BUILD_NUMBER: ${{ github.run_number }}
      SCREENSHOT_DEVICE: ${{ inputs.device }}
      SCREENSHOT_TEXT_SIZE: ${{ inputs.text_size }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          # Highest released version by its own Info.plist, not by folder name: images ship
          # aliases such as Xcode_27.app (27.0) next to Xcode_27.2.app, which name sorting mis-orders.
          XCODE=$(for app in /Applications/Xcode*.app; do
              if echo "$app" | grep -qiE 'beta|_rc'; then continue; fi
              v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null) || continue
              echo "$v $app"
            done | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 | cut -d' ' -f2-)
          echo "Selected $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          xcrun simctl list runtimes | grep iOS || true

      # Whole-module compilation type-checks every file in one pass, so one run lists every
      # error instead of stopping at the first failing file.
      - name: Build for simulator (Debug)
        id: sim
        run: |
          mkdir -p ci-out
          set +e
          xcodebuild -project Snapreel.xcodeproj -scheme Snapreel -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES ARCHS=$(uname -m) \
            SWIFT_COMPILATION_MODE=wholemodule \
            -IDEBuildingContinueBuildingAfterErrors=YES build > ci-out/build-sim.log 2>&1
          STATUS=$?
          set -e
          grep -E "(error|fatal error):" ci-out/build-sim.log | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sort -u > ci-out/errors.txt || true
          grep -E "warning:" ci-out/build-sim.log | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | grep -v -E "appintents|deprecated" | sort -u > ci-out/warnings.txt || true
          echo "### Simulator build: exit $STATUS, $(wc -l < ci-out/errors.txt) errors, $(wc -l < ci-out/warnings.txt) warnings" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != "0" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -150 ci-out/errors.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat ci-out/errors.txt
            tail -40 ci-out/build-sim.log
            exit 1
          fi
          ls build/Build/Products/Debug-iphonesimulator/Snapreel.app/PlugIns/

      - name: Simulator screenshots
        if: ${{ inputs.screenshots }}
        run: bash scripts/ci-screenshots.sh build/Build/Products/Debug-iphonesimulator/Snapreel.app ci-out/screenshots "${{ inputs.only }}" light

      - name: Simulator screenshots (Dark mode)
        if: ${{ inputs.screenshots && inputs.dark != 'none' }}
        run: bash scripts/ci-screenshots.sh build/Build/Products/Debug-iphonesimulator/Snapreel.app ci-out/dark/screenshots "${{ inputs.dark }}" dark

      - name: Record app flows
        if: ${{ inputs.flows != '' }}
        run: |
          RECORD=1 bash scripts/ci-screenshots.sh build/Build/Products/Debug-iphonesimulator/Snapreel.app ci-out/flows/light "${{ inputs.flows }}" light
          RECORD=1 bash scripts/ci-screenshots.sh build/Build/Products/Debug-iphonesimulator/Snapreel.app ci-out/flows/dark "${{ inputs.flows }}" dark

      # Reuses the team's existing distribution certificate and three App Store profiles made
      # through the App Store Connect API (app, broadcast extension, Live Activity widget
      # extension), so a run never creates or revokes anything.
      - name: Install signing certificate, profiles and API key
        if: ${{ inputs.testflight }}
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          APPSTORE_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
          BROADCAST_PROFILE_BASE64: ${{ secrets.BROADCAST_PROFILE_BASE64 }}
          LIVE_ACTIVITY_PROFILE_BASE64: ${{ secrets.LIVE_ACTIVITY_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          for SECRET in APPSTORE_PROFILE_BASE64 BROADCAST_PROFILE_BASE64 LIVE_ACTIVITY_PROFILE_BASE64; do
            if [ -z "${!SECRET}" ]; then
              echo "::error::Repository secret $SECRET is missing (an App Store provisioning profile, base64)"
              exit 1
            fi
          done
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          for PAIR in "APPSTORE_PROFILE_BASE64" "BROADCAST_PROFILE_BASE64" "LIVE_ACTIVITY_PROFILE_BASE64"; do
            echo "${!PAIR}" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
            NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
            echo "Installing profile $NAME ($UUID)"
            /usr/libexec/PlistBuddy -c "Print :Entitlements" "$RUNNER_TEMP/profile.plist" | grep -A3 application-groups || true
            for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$DIR"
              cp "$RUNNER_TEMP/profile.mobileprovision" "$DIR/$UUID.mobileprovision"
            done
            echo "$UUID" >> "$RUNNER_TEMP/installed-profiles.txt"
          done
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive (Release, distribution-signed)
        if: ${{ inputs.testflight }}
        run: |
          set +e
          xcodebuild -project Snapreel.xcodeproj -scheme Snapreel -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Snapreel.xcarchive \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive > ci-out/archive.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" != "0" ]; then
            grep -E "(error|fatal error):" ci-out/archive.log | sort -u | head -80
            tail -60 ci-out/archive.log
            exit 1
          fi
          codesign -d --entitlements :- build/Snapreel.xcarchive/Products/Applications/Snapreel.app 2>/dev/null | grep -A3 application-groups
          codesign -d --entitlements :- build/Snapreel.xcarchive/Products/Applications/Snapreel.app/PlugIns/SnapreelBroadcast.appex 2>/dev/null | grep -A3 application-groups
          codesign -dv build/Snapreel.xcarchive/Products/Applications/Snapreel.app/PlugIns/SnapreelLiveActivity.appex 2>&1 | grep -E "Identifier|TeamIdentifier"

      - name: Export and upload to App Store Connect
        if: ${{ inputs.testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyLists/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>iPhone Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$APP_PROFILE</string>
              <key>$BROADCAST_BUNDLE_ID</key><string>$BROADCAST_PROFILE</string>
              <key>$LIVE_ACTIVITY_BUNDLE_ID</key><string>$LIVE_ACTIVITY_PROFILE</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          set +e
          xcodebuild -exportArchive -archivePath build/Snapreel.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > ci-out/export.log 2>&1
          STATUS=$?
          set -e
          tail -30 ci-out/export.log
          [ "$STATUS" = "0" ] || exit 1
          echo "Uploaded build $BUILD_NUMBER of $BUNDLE_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          # The three installed profiles (app, broadcast, Live Activity), not only their temp copies.
          if [ -f "$RUNNER_TEMP/installed-profiles.txt" ]; then
            while read -r UUID; do
              [ -n "$UUID" ] || continue
              rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
              rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
            done < "$RUNNER_TEMP/installed-profiles.txt"
          fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/profile.* "$RUNNER_TEMP/installed-profiles.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapreel-ci
          retention-days: 7
          path: ci-out
          if-no-files-found: ignore

  tests:
    if: ${{ inputs.tests }}
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(for app in /Applications/Xcode*.app; do
              if echo "$app" | grep -qiE 'beta|_rc'; then continue; fi
              v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null) || continue
              echo "$v $app"
            done | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 | cut -d' ' -f2-)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu

      - name: Simulator
        run: |
          mkdir -p ci-out
          WANT="${{ inputs.test_ios }}"
          if [ -n "$WANT" ] && ! xcrun simctl list runtimes | grep -q "iOS $WANT"; then
            echo "Downloading iOS $WANT"
            xcodebuild -downloadPlatform iOS -buildVersion "$WANT" 2>&1 | tail -5 || true
          fi
          xcrun simctl list runtimes | tee ci-out/runtimes.txt
          RUNTIMES=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          want = sys.argv[1]
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          if want: rs = [r for r in rs if r["version"].startswith(want)]
          print(*[r["identifier"] for r in reversed(rs)])' "$WANT")
          [ -n "$RUNTIMES" ] || { echo "No iOS $WANT runtime available on this runner" | tee ci-out/no-runtime.txt; exit 1; }
          UDID=""
          for RUNTIME in $RUNTIMES; do
            for TYPE in "iPhone X" "iPhone 11 Pro" "iPhone 13 mini" "iPhone 14" "iPhone 17"; do
              UDID=$(xcrun simctl create "Snapreel tests" "$TYPE" "$RUNTIME" 2>/dev/null) && break 2 || UDID=""
            done
          done
          [ -n "$UDID" ] || { echo "No device could be created"; exit 1; }
          echo "$TYPE on $RUNTIME: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b > /dev/null || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      # Settings for the tests' own process travel as TEST_RUNNER_<name>. The background session probe
      # (SnapreelTests/Uploads) uploads to a slow local HTTPS server.
      - name: Upload measurements
        if: ${{ inputs.benchmarks }}
        continue-on-error: true
        run: |
          PEM="$RUNNER_TEMP/probe"; mkdir -p "$PEM"
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 -keyout "$PEM/key.pem" -out "$PEM/cert.pem" -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" -addext "extendedKeyUsage=serverAuth"
          xcrun simctl keychain "$UDID" add-root-cert "$PEM/cert.pem" || true
          nohup node scripts/h2-probe-server.mjs "$PEM/key.pem" "$PEM/cert.pem" 8443 > ci-out/probe-server.log 2>&1 &
          echo "TEST_RUNNER_RUN_BENCHMARKS=1" >> "$GITHUB_ENV"
          # iOS's background session refuses to work for an unsigned app, so this one is signed ad hoc.
          TEST_RUNNER_PROBE_URL="https://localhost:8443/" xcodebuild test -project Snapreel.xcodeproj -scheme Snapreel \
            -configuration Debug -destination "id=$UDID" -derivedDataPath build-signed -parallel-testing-enabled NO \
            -only-testing:SnapreelTests/BackgroundSessionProbe CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= ONLY_ACTIVE_ARCH=YES > ci-out/probe.log 2>&1 || true
          grep -E "PERF\||error:|Test Case" ci-out/probe.log | cut -c1-900 || true
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "nsurlsessiond"' --style compact > ci-out/nsurlsessiond.log 2>&1 || true

      # Optimised (like the App Store build) but testable, so the times mean something.
      - name: Test
        run: |
          ONLY=()
          for NAME in ${{ inputs.test_only }}; do
            if [[ "$NAME" == Snapreel* ]]; then ONLY+=("-only-testing:$NAME"); else ONLY+=("-only-testing:SnapreelTests/$NAME"); fi
          done
          set +e
          xcodebuild test -project Snapreel.xcodeproj -scheme Snapreel -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build -resultBundlePath ci-out/tests.xcresult \
            -parallel-testing-enabled NO ${ONLY[@]+"${ONLY[@]}"} \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 420 -maximum-test-execution-time-allowance 5400 \
            SWIFT_OPTIMIZATION_LEVEL=-O CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES 2>&1 \
            | tee ci-out/tests.log | grep --line-buffered -E "error:|PERF\||BEEPS\||NOTE\||Test Case"
          STATUS=${PIPESTATUS[0]}
          set -e
          grep -E "error:|PERF\||BEEPS\||NOTE\||Test Case|Executed" ci-out/tests.log | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' > ci-out/tests-summary.txt || true
          { echo "### Tests: exit $STATUS"; echo '```'; tail -c 60000 ci-out/tests-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Screenshots the UI tests took.
          mkdir -p ci-out/attachments
          xcrun xcresulttool export attachments --path ci-out/tests.xcresult --output-path ci-out/attachments > /dev/null 2>&1 || true
          [ "$STATUS" = "0" ] || tail -30 ci-out/tests.log
          exit $STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapreel-tests
          retention-days: 7
          path: |
            ci-out/tests.log
            ci-out/probe*.log
            ci-out/nsurlsessiond.log
            ci-out/tests-summary.txt
            ci-out/runtimes.txt
            ci-out/attachments
          if-no-files-found: ignore
