<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapreel</title>
<meta name="description" content="Snapreel records your screen, camera or voice on iPhone. Your recordings stay on your iPhone.">
<meta name="color-scheme" content="light dark">
<style>
  :root { --bg: #ffffff; --text: #16181f; --muted: #5d6170; --red: #f04850; --line: #e8e9ee; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111218; --text: #f4f4f6; --muted: #a2a6b4; --line: #2a2c37; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 560px; margin: 0 auto; padding: 48px 20px; }
  .mark { width: 56px; height: 56px; border-radius: 16px; background: var(--red); display: grid; place-items: center; margin-bottom: 28px; }
  .mark span { width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 6px rgba(255,255,255,.28); }
  h1 { font-size: 40px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 12px; }
  p { margin: 0 0 14px; color: var(--muted); }
  a { color: var(--red); text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { max-width: 560px; width: 100%; margin: 0 auto; padding: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><span></span></div>
  <h1>Snapreel</h1>
  <p>Record your screen, your camera or your voice on iPhone, then watch, title and share the recording.</p>
  <p>No account and no cloud: your recordings stay on your iPhone.</p>
  <p>Questions? <a href="mailto:support@snapreel.video">support@snapreel.video</a></p>
</main>
<footer>&copy; 2026 Arclayer Ltd</footer>
</body>
</html>
