<!doctype html>
<!-- Source for web/app/(marketing)/opengraph-image.jpg and twitter-image.jpg. Render it with:
     node scripts/web-review.mjs --shot "file:///<repo>/art/web/og.html" og.png 1200 630
     then save og.png as both JPEGs (quality 86). Uses the composed hero scene and phone from
     web/public/marketing/art/, so run scripts/web-compose.py first. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; isolation: isolate; color: #13141b;
    font-family: Outfit, "Segoe UI", sans-serif;
    background: #4f8fe6;
  }
  .scene { position: absolute; left: 0; top: 120px; width: 1200px; height: auto; z-index: -2;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 90px); }
  .glow { position: absolute; left: 50%; top: -120px; width: 1100px; height: 520px; transform: translateX(-50%); z-index: -1;
    background: radial-gradient(closest-side, rgba(255,255,255,.42), rgba(255,255,255,0)); }
  .brand { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
    padding: 10px 22px 10px 14px; border-radius: 999px; background: #fff; font-weight: 700; font-size: 26px; letter-spacing: -.03em;
    box-shadow: 0 10px 30px -10px rgba(30,50,90,.35); }
  h1 { position: absolute; left: 0; right: 0; top: 118px; text-align: center; font-weight: 700; font-size: 62px; line-height: 1.04; letter-spacing: -.03em; }
  .phone { position: absolute; left: 50%; top: 286px; width: 236px; transform: translateX(-50%); }
  .pill { position: absolute; right: 40px; bottom: 36px; padding: 10px 20px; border-radius: 999px; background: #d32434; color: #fff; font-weight: 700; font-size: 22px; }
</style>
</head>
<body>
  <img class="scene" src="../../web/public/marketing/art/scene-hero-wide-light-1920.webp" alt="">
  <div class="glow"></div>
  <div class="brand">
    <svg viewBox="0 0 32 32" width="32" height="32"><circle cx="16" cy="16" r="13" fill="none" stroke="#f04850" stroke-width="3.4"/><circle cx="16" cy="16" r="6.4" fill="#f04850"/></svg>
    Snapreel
  </div>
  <h1>Record it on your iPhone.<br>They watch it anywhere.</h1>
  <img class="phone" src="../../web/public/marketing/art/phone-hero-light-2x.webp" alt="">
  <div class="pill">snapreel.video</div>
</body>
</html>
